<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樂理輕鬆學 (語音自學版) | Interactive Music Theory</title>
<style>
:root{--bg:#f4f6f9;--panel:#fff;--pri:#1a5276;--sec:#2980b9;--acc:#e67e22;--txt:#2c3e50;--bdr:#dcdde1;--fs:16px}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:var(--bg);color:var(--txt);font-size:var(--fs);height:100vh;display:flex;flex-direction:column;overflow:hidden}
header{background:linear-gradient(135deg,var(--pri),var(--sec));color:#fff;padding:10px 18px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 5px rgba(0,0,0,.1);gap:12px;flex-wrap:wrap}
.header-title h1{font-size:1.3em;margin-bottom:2px}.header-title p{font-size:.82em;opacity:.92}
/*.header-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap} */
.header-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;flex:1;justify-content:flex-end}

/* Study Progress Bar in Header (pushed to the left) */
.progress-grp{margin-right:auto;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;font-weight:700;font-size:.88em;line-height:1.2;white-space:nowrap}


/* Unified Control Group Styling (Buttons, Speed Label & Select Box) */
.ctrl-grp{display:flex;align-items:center;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.ctrl-grp button{background:transparent;border:none;color:#fff;padding:6px 11px;cursor:pointer;font-weight:700;font-size:.88em;line-height:1.2}
.ctrl-grp button:hover,.ctrl-grp button.active{background:rgba(255,255,255,.4)}
.ctrl-label{color:#fff;padding:6px 6px 6px 11px;font-weight:700;font-size:.88em;line-height:1.2;white-space:nowrap}
.ctrl-select{background:transparent;color:#fff;border:none;padding:6px 11px 6px 4px;font-weight:700;font-size:.88em;line-height:1.2;cursor:pointer;outline:none}
.ctrl-select option{color:var(--txt);background:#fff;font-weight:700}

/* Study Progress Bar in Header */
.progress-grp{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.2);padding:6px 12px;border-radius:6px;font-weight:700;font-size:.88em;line-height:1.2;white-space:nowrap}
.progress-bar-bg{width:85px;height:10px;background:rgba(255,255,255,.3);border-radius:5px;overflow:hidden}
.progress-bar-fill{height:100%;background:#2ecc71;width:0%;transition:width .3s ease}

.main-container{display:flex;flex:1;overflow:hidden;position:relative}
.col{background:var(--panel);border-right:1px solid var(--bdr);display:flex;flex-direction:column;transition:width .25s}
.col-hdr{background:#f8f9fa;padding:9px 14px;font-weight:700;border-bottom:1px solid var(--bdr);display:flex;justify-content:space-between;align-items:center;font-size:.92em}
.collapse-btn{background:none;border:none;cursor:pointer;font-size:1.1em;color:var(--pri)}
#left-col{
    flex-basis: 290px; 
    min-width: 200px;
    max-width: 50%;
    font-size:.82em;
    flex-shrink:0;
    transition: none; 
}
.toc-list{overflow-y:auto;flex:1;padding:8px}
.ch-title{font-weight:700;color:var(--pri);margin:12px 0 4px;padding-bottom:3px;border-bottom:2px solid var(--sec);font-size:1.02em}
.topic-item{padding:7px 9px;margin:2px 0;border-radius:4px;cursor:pointer;border-left:3px solid transparent;display:flex;justify-content:space-between;align-items:center}
.topic-item:hover{background:#ebf5fb}.topic-item.active{background:#d4e6f1;border-left-color:var(--pri);font-weight:700}
.topic-check{color:#27ae60;font-weight:bold;font-size:.95em;margin-left:6px;padding:0 4px;border-radius:3px;cursor:pointer}
.topic-check:hover{background:#fadbd8;color:#c0392b}
#middle-col{flex:1.35;overflow-y:auto;padding:18px}
#right-col{flex:1.15;overflow-y:auto;padding:18px;background:#fafafa}
.card{background:#fdfefe;border:1px solid var(--bdr);border-radius:8px;padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.card-title{font-weight:700;color:var(--sec);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.svg-box{background:#fff;border:2px solid #bdc3c7;border-radius:8px;padding:12px;text-align:center;margin:14px 0;overflow-x:auto;}
/* Rule to specifically resize the Clef_staff.svg image */
img[src*="clef_staff.svg"] {
    max-width: 300px !important;
    height: auto;
}

.tts-btn{background:var(--sec);color:#fff;border:none;padding:4px 10px;border-radius:4px;cursor:pointer;font-size:.82em}
.tts-btn:hover{background:var(--pri)}
.quiz-card{background:#fff;border:1px solid var(--bdr);border-radius:8px;padding:14px;margin-bottom:14px}
.opt-list{list-style:none;margin-top:8px}
.opt-item{padding:8px 11px;margin:5px 0;border:1px solid var(--bdr);border-radius:5px;cursor:pointer}
.opt-item:hover{background:#ebf5fb;border-color:var(--sec)}
.opt-item.correct{background:#d4efdf!important;border-color:#27ae60!important;font-weight:700}
.opt-item.incorrect{background:#fadbd8!important;border-color:#c0392b!important}
.hint-btn{background:none;border:none;color:var(--acc);cursor:pointer;font-weight:700;margin-top:6px;font-size:.88em}
.hint-box{background:#fef9e7;border-left:4px solid var(--acc);padding:9px;margin-top:8px;font-size:.88em;display:none}
.exp-box{margin-top:8px;padding:8px;background:#eaf2f8;border-radius:4px;font-size:.88em;display:none}
.col.collapsed{flex-basis:42px!important;min-width:42px!important;max-width: 42px!important;padding:0!important;overflow:hidden; transition: flex-basis 0.25s;}
.col.collapsed>*:not(.col-hdr){display:none}
.col.collapsed .col-hdr{writing-mode:vertical-lr;padding:15px 5px;height:100%;justify-content:center;gap:10px;cursor:pointer;border-bottom:none}
.btn-stop-tts { background-color: #be123c !important; }
.btn-stop-tts:hover { background-color: #9f1239 !important; }

/* Image Modal Styles */
.img-modal { display: none; position: fixed; z-index: 1000; padding-top: 50px; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.9); }
.img-modal-content { margin: auto; display: block; width: 80%; max-width: 900px; background-color: white; border-radius: 8px; padding: 20px; }
.img-modal-close { position: absolute; top: 15px; right: 35px; color: #f1f1f1; font-size: 40px; font-weight: bold; transition: 0.3s; cursor: pointer; }
.img-modal-close:hover, .img-modal-close:focus { color: #bbb; text-decoration: none; cursor: pointer; }

/* Style for the link buttons */
.resource-link { display: inline-block; background-color: #2563eb; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-weight: bold; font-size: 0.9em; margin-right: 10px; margin-bottom: 10px; }
.resource-link:hover { background-color: #1d4ed8; }
.video-link { background-color: #ef4444; }
.video-link:hover { background-color: #dc2626; }

/* Resizer Bar Style */
.resizer {
  width: 6px;
  background: var(--bdr);
  cursor: col-resize;
  flex-shrink: 0;
  transition: background 0.2s;
  z-index: 10;
}
.resizer:hover, .resizer:active {
  background: var(--sec);
}
</style>
</head>
<body>
<header>
  <div class="header-title">
    <h1 id="app-title">樂理輕鬆學 (語音自學版) Interactive Music Theory (Audio Self-Learning Edition)</h1>
    <p id="app-subtitle">根據 ABRSM 五級樂理教材編製‧配備粵英雙語朗讀 Based on ABRSM Curriculum with Voice Read-Aloud</p>
  </div>
  <div class="header-controls">
    <!-- Study Progress Tracker on the left -->
    <div class="progress-grp" title="學習進度 / Study Progress">
      <span id="lbl-progress">學習進度: 0/0 (0%)</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- All buttons moved to the right -->
    <div class="ctrl-grp">
      <label for="tts-speed" id="lbl-speed" class="ctrl-label">語速:</label>
      <select id="tts-speed" class="ctrl-select">
        <option value="0.75">0.75x</option>
        <option value="0.9" selected>0.9x</option>
        <option value="1.0">1.0x</option>
        <option value="1.25">1.25x</option>
      </select>
    </div>

    <div class="ctrl-grp">
      <button type="button" class="btn-stop-tts" onclick="stopSpeech()" id="btn-stop-tts">&#9209; 停止朗讀</button>
    </div>
    <div class="ctrl-grp">
      <button onclick="adjFont(-1)">A-</button>
      <button onclick="adjFont(1)">A+</button>
    </div>
    <div class="ctrl-grp">
      <button id="btn-zh" class="active" onclick="setLang('zh')">繁體中文</button>
      <button id="btn-en" onclick="setLang('en')">English</button>
    </div>
  </div>

</header>

<div class="main-container">
  <div class="col" id="left-col">
    <div class="col-hdr" onclick="if(this.parentElement.classList.contains('collapsed')) togCol('left-col')">
      <span id="hdr-c1">課程目錄 Chapters</span>
      <button class="collapse-btn" onclick="event.stopPropagation(); togCol('left-col')">◀</button>
    </div>
    <div class="toc-list" id="toc-list"></div>
  </div>
  
  <!-- The Resizer Bar -->
  <div class="resizer" id="dragMe"></div>

  <div class="col" id="middle-col">
    <div class="col-hdr" onclick="if(this.parentElement.classList.contains('collapsed')) togCol('middle-col')">
      <span id="hdr-c2">詳細教材內容與圖解 Content & Diagrams</span>
      <button class="collapse-btn" onclick="event.stopPropagation(); togCol('middle-col')">◀</button>
    </div>
    <div id="content-area"></div>
  </div>

  <!-- UPDATED: Column 3 (right-col) defaults to collapsed -->
  <div class="col collapsed" id="right-col">
    <div class="col-hdr" onclick="if(this.parentElement.classList.contains('collapsed')) togCol('right-col')">
      <span id="hdr-c3">互動練習與引導思考 Exercises & Hints</span>
      <button class="collapse-btn" onclick="event.stopPropagation(); togCol('right-col')">◀</button>
    </div>
    <div id="quiz-area"></div>
  </div>
</div>

<!-- The Image Modal -->
<div id="imageModal" class="img-modal">
  <span class="img-modal-close" onclick="closeModal()">&times;</span>
  <img class="img-modal-content" id="modalImg">
</div>

<script>
let lang = 'zh', curId = null, fSize = 16;
let musicTheoryDB = [];
let visitedTopics = new Set();

// Load saved study progress from localStorage if available
try {
    const savedProgress = localStorage.getItem('musicTheory_visitedTopics');
    if (savedProgress) {
        visitedTopics = new Set(JSON.parse(savedProgress));
    }
} catch(e) { console.warn("Could not access localStorage", e); }

// --- GOOGLE SHEETS CSV LINKS ---
const PPT_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSwGdF67wohQQ-No0CVNzEaaJx4Q7ioxJf-Q99uMxRK06Gjvl3bbI5WnnVdC2--2mZ7yZmWZuA0rY2/pub?gid=0&single=true&output=csv"; 
const MP4_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSSwGdF67wohQQ-No0CVNzEaaJx4Q7ioxJf-Q99uMxRK06Gjvl3bbI5WnnVdC2--2mZ7yZmWZuA0rY2/pub?gid=944104139&single=true&output=csv";

let pptLinksMap = {};
let mp4LinksMap = {};

function parseCSV(text) {
    const lines = text.split('\n');
    const result = {};
    for (let i = 1; i < lines.length; i++) {
        const match = lines[i].match(/(?:"([^"]*)")|([^,]+)/g);
        if (match && match.length >= 2) {
            let topicId = match[0].replace(/"/g, '').trim();
            let link = match[1].replace(/"/g, '').trim();
            if (topicId && link) {
                result[topicId] = link;
            }
        }
    }
    return result;
}

async function fetchGoogleSheetLinks() {
    try {
        if(PPT_CSV_URL !== "YOUR_PPT_CSV_URL_HERE"){
            const pptResponse = await fetch(PPT_CSV_URL);
            if(pptResponse.ok){
                const pptText = await pptResponse.text();
                pptLinksMap = parseCSV(pptText);
            }
        }
    } catch(e) { console.error("Failed to load PPT CSV", e); }

    try {
        if(MP4_CSV_URL !== "YOUR_MP4_CSV_URL_HERE"){
            const mp4Response = await fetch(MP4_CSV_URL);
            if(mp4Response.ok){
                const mp4Text = await mp4Response.text();
                mp4LinksMap = parseCSV(mp4Text);
            }
        }
    } catch(e) { console.error("Failed to load MP4 CSV", e); }
}

async function loadAppData() {
  try {
    // 1. Fetch links from Google Sheets first
    await fetchGoogleSheetLinks();

    // 2. Fetch Chapter 1 data
    const response = await fetch('./data/chapter1.json');
    if (!response.ok) throw new Error("Network response was not ok");
    const chapter1Data = await response.json();

    // 3. Fetch Chapter 2 data
    const response2 = await fetch('./data/chapter2.json');
    if (!response2.ok) throw new Error("Network response 2 was not ok");
    const chapter2Data = await response2.json();
    
    // 4. Combine both chapters into the main database
    musicTheoryDB = [...chapter1Data, ...chapter2Data];
    
    if (musicTheoryDB.length > 0 && musicTheoryDB[0].concepts.length > 0) {
      curId = musicTheoryDB[0].concepts[0].id;
    }
    
    updateHeaderUI();
    renderTOC();
    if(curId) {
        loadTopic(curId);
    }
  } catch (error) {
    console.error("Failed to fetch app data:", error);
    document.getElementById('content-area').innerHTML = 
      "<h3 style='color:red;'>⚠️ Failed to load Chapter Data.</h3><p>Because you are loading external JSON files using 'fetch()', you cannot just double-click the HTML file to run it. You MUST open this folder using a local web server (like 'Live Server' in VS Code, or python3 -m http.server).</p>";
  }
}

const CH_META = [
  ["ch1","Chapter 1: The Basics of Rhythm and Tempo","第一章：節奏與速度基礎",4,"1"],
  ["ch2","Chapter 2: Introduction to Pitch","第二章：音高導論",4,"2"],
  ["ch3","Chapter 3: Continuing with Rhythm","第三章：節奏續論",4,"3"],
  ["ch4","Chapter 4: More Scales, Keys and Clefs","第四章：更多音階、調性與譜號",7,"4"],
  ["ch5","Chapter 5: The Grouping of Notes and Rests","第五章：音符與休止符的組合",5,"5"],
  ["ch6","Chapter 6: Rhythm: Words, Syncopation","第六章：節奏：字詞與切分音",3,"6"],
  ["ch7","Chapter 7: Intervals and Transposition","第七章：音程與移調",5,"7"],
  ["ch8","Chapter 8: Triads and Chords","第八章：三和弦與和弦",3,"8"],
  ["ch9","Chapter 9: Phrases and Cadences","第九章：樂句與終止式",3,"9"],
  ["ch10","Chapter 10: Tempo, Dynamics and Mood","第十章：速度、力度與情緒",4,"10"],
  ["ch11","Chapter 11: Articulation","第十一章：表情與奏法",5,"11"],
  ["ch12","Chapter 12: Ornaments and Embellishments","第十二章：裝飾音",2,"12"],
  ["ch13","Chapter 13: Reiterations and Repeats","第十三章：反覆與重覆",4,"13"]
];

function updateStudyProgress() {
  let totalLoaded = 0;
  musicTheoryDB.forEach(ch => {
    totalLoaded += ch.concepts.length;
  });
  
  let completed = visitedTopics.size;
  let pct = totalLoaded > 0 ? Math.min(100, Math.round((completed / totalLoaded) * 100)) : 0;
  
  const lbl = document.getElementById('lbl-progress');
  const fill = document.getElementById('progress-fill');
  if (lbl) {
    lbl.textContent = lang === 'zh' 
      ? `學習進度: ${completed}/${totalLoaded} (${pct}%)` 
      : `Progress: ${completed}/${totalLoaded} (${pct}%)`;
  }
  if (fill) {
    fill.style.width = `${pct}%`;
  }
}

function updateHeaderUI() {
  const isZh = lang === 'zh';
  document.getElementById('lbl-speed').textContent = isZh ? '語速:' : 'Speed:';
  document.getElementById('btn-stop-tts').innerHTML = isZh ? '&#9209; 停止朗讀' : '&#9209; Stop';
  document.getElementById('hdr-c1').textContent = isZh ? '課程目錄 Chapters' : 'Chapters';
  document.getElementById('hdr-c2').textContent = isZh ? '詳細教材內容與圖解 Content & Diagrams' : 'Content & Diagrams';
  document.getElementById('hdr-c3').textContent = isZh ? '互動練習與引導思考 Exercises & Hints' : 'Exercises & Hints';
  updateStudyProgress();
}

function toggleTopicStatus(id) {
  if (visitedTopics.has(id)) {
    visitedTopics.delete(id);
  } else {
    visitedTopics.add(id);
  }
  try {
    localStorage.setItem('musicTheory_visitedTopics', JSON.stringify([...visitedTopics]));
  } catch(e) {}
  updateStudyProgress();
  renderTOC();
}

function toggleTopicStatus(id) {
  if (visitedTopics.has(id)) {
    visitedTopics.delete(id);
  } else {
    visitedTopics.add(id);
  }
  try {
    localStorage.setItem('musicTheory_visitedTopics', JSON.stringify([...visitedTopics]));
  } catch(e) {}
  updateStudyProgress();
  renderTOC();
}


function toggleTopicStatus(id) {
  if (visitedTopics.has(id)) {
    visitedTopics.delete(id);
  } else {
    visitedTopics.add(id);
  }
  try {
    localStorage.setItem('musicTheory_visitedTopics', JSON.stringify([...visitedTopics]));
  } catch(e) {}
  updateStudyProgress();
  renderTOC();
}

function renderTOC() {
  const toc = document.getElementById('toc-list');
  toc.innerHTML = '';
  
  musicTheoryDB.forEach(chapter => {
    const chDiv = document.createElement('div');
    chDiv.className = 'ch-title';
    chDiv.textContent = lang === 'zh' ? chapter.title.zh : chapter.title.en;
    toc.appendChild(chDiv);
    
    chapter.concepts.forEach(concept => {
      const item = document.createElement('div');
      item.className = 'topic-item' + (concept.id === curId ? ' active' : '');
      item.title = lang === 'zh' ? '再次點擊可切換完成狀態 (✓)' : 'Click again to toggle completion (✓)';
      
      const nameSpan = document.createElement('span');
      nameSpan.textContent = lang === 'zh' ? concept.name.zh : concept.name.en;
      item.appendChild(nameSpan);

      if (visitedTopics.has(concept.id)) {
        const checkSpan = document.createElement('span');
        checkSpan.className = 'topic-check';
        checkSpan.textContent = '✓';
        checkSpan.title = lang === 'zh' ? '點擊以重置完成狀態' : 'Click to reset completion status';
        checkSpan.onclick = (e) => {
          e.stopPropagation();
          toggleTopicStatus(concept.id);
        };
        item.appendChild(checkSpan);
      }

      item.onclick = () => loadTopic(concept.id, true);
      toc.appendChild(item);
    });
  });

  let loadedChapters = musicTheoryDB.map(ch => ch.chapterId);
  CH_META.forEach(([cid, en, zh, cnt, pfx]) => {
     if(!loadedChapters.includes(cid)){
        const chDiv = document.createElement('div');
        chDiv.className = 'ch-title';
        chDiv.textContent = lang === 'zh' ? zh : en;
        toc.appendChild(chDiv);
        for (let i = 1; i <= cnt; i++) {
           const id = `${pfx}/${i}`;
           const item = document.createElement('div');
           item.className = 'topic-item';
           item.textContent = lang === 'zh' ? `${id} 待載入單元` : `${id} Topic (Pending)`;
           toc.appendChild(item);
        }
     }
  });
}

function findConceptById(id) {
  for (let chapter of musicTheoryDB) {
    const concept = chapter.concepts.find(c => c.id === id);
    if (concept) return { chapter, concept };
  }
  return null;
}

function loadTopic(id, isUserClick = false) {
  stopSpeech();
  
  // If user clicks the currently active topic again, toggle its green tick status
  if (isUserClick && curId === id) {
    toggleTopicStatus(id);
    return;
  }

  curId = id;
  visitedTopics.add(id);

  try {
    localStorage.setItem('musicTheory_visitedTopics', JSON.stringify([...visitedTopics]));
  } catch(e) {}

  updateStudyProgress();
  renderTOC();
  const data = findConceptById(id);
  if (!data) return;
  
  const { concept } = data;
  const isZh = lang === 'zh';
  const title = isZh ? concept.name.zh : concept.name.en;
  const def = (isZh ? concept.definition.zh : concept.definition.en).replace(/\n/g, '<br>');
  const ex = (isZh ? concept.examples.zh : concept.examples.en).replace(/\n/g, '<br>');
  const tip = (isZh ? concept.tip.zh : concept.tip.en).replace(/\n/g, '<br>');

  let diagramHTML = "";
  if (concept.visualDiagrams && concept.visualDiagrams.length > 0) {
      concept.visualDiagrams.forEach((diagram, index) => {
          let explanationHTML = "";
          if (diagram.explanation) {
             let explanationText = (isZh ? diagram.explanation.zh : diagram.explanation.en).replace(/\n/g, '<br>');
             explanationHTML = '<p style="margin-bottom: 10px; font-style: italic; text-align: left; line-height: 1.6; color: var(--acc);">' + explanationText + '</p>';
          }

          diagramHTML +=
              '<div class="svg-box">' +
                '<div class="card-title" style="margin-bottom:6px"><span>' + diagram.title[lang] + '</span><button class="tts-btn" onclick="speakSpecificDiagram(' + index + ', this)">🔊</button></div>' +
                explanationHTML + 
                '<img src="' + diagram.imagePath + '" alt="' + diagram.altText + '" style="width: 100%; max-width: 500px; display: block; margin: 15px auto; cursor: pointer;" onclick="openModal(this.src)">' +
              '</div>';
      });
  } else if (concept.visualDiagram) {
      let explanationHTML = "";
      if (concept.visualDiagram.explanation) {
             let explanationText = (isZh ? concept.visualDiagram.explanation.zh : concept.visualDiagram.explanation.en).replace(/\n/g, '<br>');
             explanationHTML = '<p style="margin-bottom: 10px; font-style: italic; text-align: left; line-height: 1.6; color: var(--acc);">' + explanationText + '</p>';
            }

      diagramHTML =
          '<div class="svg-box">' +
            '<div class="card-title" style="margin-bottom:6px"><span>' + concept.visualDiagram.title[lang] + '</span><button class="tts-btn" onclick="speakCurrentDiagram(this)">🔊</button></div>' +
            explanationHTML +
            '<img src="' + concept.visualDiagram.imagePath + '" alt="' + concept.visualDiagram.altText + '" style="width: 100%; max-width: 500px; display: block; margin: 15px auto; cursor: pointer;" onclick="openModal(this.src)">' +
          '</div>';
  }

  // --- DYNAMIC LINKS FROM GOOGLE SHEETS ---
  let resourceLinksHTML = "";
  let linksArray = [];

  if (pptLinksMap[concept.id]) {
      let pptText = isZh ? "📄 開啟本節投影片" : "📄 Open Presentation Slide";
      linksArray.push(`
          <a href="${pptLinksMap[concept.id]}" target="_blank" rel="noopener noreferrer" class="resource-link">
             ${pptText} ↗
          </a>
      `);
  }

  if (mp4LinksMap[concept.id]) {
      let videoText = isZh ? "▶ 觀看教學影片" : "▶ Watch Tutorial Video";
      linksArray.push(`
          <a href="${mp4LinksMap[concept.id]}" target="_blank" rel="noopener noreferrer" class="resource-link video-link">
             ${videoText} ↗
          </a>
      `);
  }

  if (linksArray.length > 0) {
      resourceLinksHTML = `<div style="margin-bottom: 15px;">${linksArray.join('')}</div>`;
  }
  // ----------------------------------------

  document.getElementById('content-area').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="color:var(--pri);font-size:1.25em">${title}</h2>
      <button class="tts-btn" onclick="speak(document.getElementById('mid-all').innerText)">🔊 ${isZh?'朗讀全課':'Read All'}</button>
    </div>
    ${resourceLinksHTML}
    <div id="mid-all">
      <div class="card">
        <div class="card-title"><span>📖 ${isZh?'核心定義與詳細說明':'Definition & Comprehensive Explanation'}</span><button class="tts-btn" onclick="speak(this.parentElement.nextElementSibling.innerText)">🔊</button></div>
        <p style="line-height:1.65">${def}</p>
      </div>
      ${diagramHTML}
      <div class="card">
        <div class="card-title"><span>🎼 ${isZh?'樂譜範例與重點拆解':'Notation Examples & Key Breakdown'}</span><button class="tts-btn" onclick="speak(this.parentElement.nextElementSibling.innerText)">🔊</button></div>
        <p style="line-height:1.65">${ex}</p>
      </div>
      <div class="card" style="background:#fcf3cf;border-color:#f39c12">
        <div class="card-title" style="color:#d68910"><span>💡 ${isZh?'應試錦囊 (Study Tip)':'Study Tip'}</span><button class="tts-btn" onclick="speak(this.parentElement.nextElementSibling.innerText)">🔊</button></div>
        <p style="line-height:1.6">${tip}</p>
      </div>
    </div>`;

  let qHtml = `<h3 style="margin-bottom:12px;color:var(--pri)">📝 ${isZh?'互動練習與引導思考':'Interactive Exercises & Guiding Hints'}</h3>`;
  
  if (concept.exercises) {
      concept.exercises.forEach((ex, idx) => {
        const qTxt = isZh ? ex.question.zh : ex.question.en;
        const hint = (isZh ? ex.guidingQuestions.zh : ex.guidingQuestions.en).join(' ');
        const exp = isZh ? ex.explanation.zh : ex.explanation.en;

        let optsHTML = "";
        ex.options.forEach((opt, oIdx) => {
            optsHTML += `<li class="opt-item" onclick="chkAns(this, ${oIdx === ex.correctIndex})">${isZh ? opt.zh : opt.en}</li>`;
        });

        qHtml += `<div class="quiz-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
            <div style="font-weight:700">Q${idx+1}: ${qTxt}</div>
            <button class="tts-btn" onclick="speak('${qTxt.replace(/'/g,"\\'")}')">🔊</button>
          </div>
          <ul class="opt-list">
            ${optsHTML}
          </ul>
          <button class="hint-btn" onclick="togHint(this)">💡 ${isZh?'查看引導思考提示 (Guiding Hint)':'Show Guiding Hint'}</button>
          <div class="hint-box">${hint} <button class="tts-btn" style="margin-left:6px" onclick="speak(this.parentElement.innerText)">🔊</button></div>
          <div class="exp-box"><strong>${isZh?'答案解析：':'Explanation:'}</strong> ${exp} <button class="tts-btn" style="margin-left:6px" onclick="speak(this.parentElement.innerText)">🔊</button></div>
        </div>`;
      });
  }
  document.getElementById('quiz-area').innerHTML = qHtml;
}

function chkAns(el, ok) {
  const ul = el.parentElement;
  ul.querySelectorAll('.opt-item').forEach(li => li.style.pointerEvents = 'none');
  if (ok) {
      el.classList.add('correct');
  } else {
      el.classList.add('incorrect');
      ul.querySelectorAll('.opt-item').forEach(li => { 
          if(li.getAttribute('onclick').includes('true')){
              li.classList.add('correct');
          }
      });
  }
  ul.parentElement.querySelector('.exp-box').style.display = 'block';
}

function togHint(btn) {
  const box = btn.nextElementSibling;
  box.style.display = box.style.display === 'block' ? 'none' : 'block';
}

function speakSpecificDiagram(index, btn) {
  const data = findConceptById(curId);
  if (!data || !data.concept.visualDiagrams || !data.concept.visualDiagrams[index]) return;
  
  let textToSpeak = data.concept.visualDiagrams[index].title[lang];
  if(data.concept.visualDiagrams[index].explanation) {
      textToSpeak += "。 " + data.concept.visualDiagrams[index].explanation[lang];
  }
  speak(textToSpeak, btn);
}

function speakCurrentDiagram(btn) {
  const data = findConceptById(curId);
  if (!data || !data.concept.visualDiagram) return;
  
  let textToSpeak = data.concept.visualDiagram.title[lang];
  if (data.concept.visualDiagram.explanation) {
      textToSpeak += "。 " + data.concept.visualDiagram.explanation[lang];
  }
  speak(textToSpeak, btn);
}

function speak(txt) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(txt);
  u.lang = lang === 'zh' ? 'zh-HK' : 'en-GB';
  u.rate = parseFloat(document.getElementById('tts-speed').value);
  window.speechSynthesis.speak(u);
}

function stopSpeech() {
  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }
}

function setLang(l) {
  stopSpeech();
  lang = l;
  document.getElementById('btn-zh').classList.toggle('active', l === 'zh');
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  updateHeaderUI();
  if(curId) loadTopic(curId, false);
}


function adjFont(d) {
  fSize = Math.max(13, Math.min(22, fSize + d));
  document.documentElement.style.setProperty('--fs', fSize + 'px');
}

function togCol(id) {
  const panel = document.getElementById(id);
  const isCollapsed = panel.classList.toggle('collapsed');
  const btn = panel.querySelector('.collapse-btn');
  
  // Update arrow icon direction dynamically
  if (btn) {
      if (id === 'right-col') {
          btn.textContent = isCollapsed ? '◀' : '▶';
      } else {
          btn.textContent = isCollapsed ? '▶' : '◀';
      }
  }

  if(id === 'left-col') {
      const resizer = document.getElementById('dragMe');
      if (isCollapsed) {
          panel.style.flexBasis = ''; 
          resizer.style.cursor = 'default';
          resizer.style.pointerEvents = 'none';
      } else {
          resizer.style.cursor = 'col-resize';
          resizer.style.pointerEvents = 'auto';
      }
  }
}

// Modal Functions
function openModal(imageSrc) {
  document.getElementById("modalImg").src = imageSrc;
  document.getElementById("imageModal").style.display = "block";
}

function closeModal() {
  document.getElementById("imageModal").style.display = "none";
}

window.onclick = function(event) {
  var modal = document.getElementById("imageModal");
  if (event.target == modal) {
    closeModal();
  }
}

// --- Resizer Drag Logic ---
const resizer = document.getElementById('dragMe');
const leftSide = document.getElementById('left-col');

let x = 0;
let leftWidth = 0;

const mouseDownHandler = function(e) {
    if(leftSide.classList.contains('collapsed')) return;
    
    x = e.clientX;
    leftWidth = leftSide.getBoundingClientRect().width;

    document.addEventListener('mousemove', mouseMoveHandler);
    document.addEventListener('mouseup', mouseUpHandler);
    document.body.style.userSelect = 'none';
};

const mouseMoveHandler = function(e) {
    const dx = e.clientX - x;
    const newWidth = leftWidth + dx;
    
    if(newWidth > 200 && newWidth < window.innerWidth * 0.5) {
         leftSide.style.flexBasis = `${newWidth}px`;
    }
};

const mouseUpHandler = function() {
    document.body.style.userSelect = '';
    document.removeEventListener('mousemove', mouseMoveHandler);
    document.removeEventListener('mouseup', mouseUpHandler);
};

resizer.addEventListener('mousedown', mouseDownHandler);
// ------------------------------

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", loadAppData);
} else {
  loadAppData();
}
</script>
</body>
</html>
