<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 920" width="100%" height="100%">
  <defs>
    <style>
      .title {
        font-family: 'Century Gothic', 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 54px;
        font-weight: 800;
        fill: #222222;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .label-main {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 22px;
        font-weight: 700;
        fill: #222222;
        text-anchor: middle;
      }
      .label-sub {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 19px;
        font-weight: 600;
        fill: #333333;
        text-anchor: middle;
      }
      .tree-line {
        stroke: #222222;
        stroke-width: 2.5;
        stroke-linecap: square;
        fill: none;
      }
    </style>

    <!-- 全音符 (Whole Notehead) -->
    <g id="whole-note">
      <ellipse cx="0" cy="0" rx="19" ry="12" fill="#222" transform="rotate(-20)"/>
      <ellipse cx="0" cy="0" rx="14" ry="6.5" fill="#fff" transform="rotate(-40)"/>
    </g>

    <!-- 二分音符 (Half Note) -->
    <g id="half-note">
      <ellipse cx="0" cy="0" rx="15" ry="9.5" fill="#222" stroke="#222" stroke-width="1" transform="rotate(-28)"/>
      <ellipse cx="0" cy="0" rx="11" ry="4" fill="#fff" transform="rotate(-45)"/>
      <rect x="11.5" y="-55" width="2.5" height="55" fill="#222"/>
    </g>

    <!-- 四分音符 (Quarter Note) -->
    <g id="quarter-note">
      <ellipse cx="0" cy="0" rx="13.5" ry="9" fill="#222" transform="rotate(-28)"/>
      <rect x="10.5" y="-55" width="2.5" height="55" fill="#222"/>
    </g>

    <!-- 八分音符 (單獨帶單符尾) -->
    <g id="eighth-note">
      <ellipse cx="0" cy="0" rx="12" ry="8.5" fill="#222" transform="rotate(-28)"/>
      <rect x="9.5" y="-55" width="2.5" height="55" fill="#222"/>
      <path d="M 12 -55 C 16 -35, 30 -30, 24 -12 C 22.5 -19, 16 -26, 12 -28 Z" fill="#222"/>
    </g>

    <!-- 十六分音符 (單獨帶雙符尾) -->
    <g id="sixteenth-note">
      <ellipse cx="0" cy="0" rx="10" ry="7" fill="#222" transform="rotate(-28)"/>
      <rect x="8" y="-50" width="2.5" height="50" fill="#222"/>
      <path d="M 10.5 -50 C 14 -35, 23 -31, 20 -15 C 18.5 -21, 13.5 -27, 10.5 -29 Z" fill="#222"/>
      <path d="M 10.5 -38 C 14 -23, 23 -19, 20 -3 C 18.5 -9, 13.5 -15, 10.5 -17 Z" fill="#222"/>
    </g>

    <!-- 雙十六分音符 (成對雙連桿) -->
    <g id="sixteenth-pair">
      <g transform="translate(-16, 0)">
        <ellipse cx="0" cy="0" rx="10" ry="7" fill="#222" transform="rotate(-28)"/>
        <rect x="8" y="-50" width="2.5" height="50" fill="#222"/>
      </g>
      <g transform="translate(16, 0)">
        <ellipse cx="0" cy="0" rx="10" ry="7" fill="#222" transform="rotate(-28)"/>
        <rect x="8" y="-50" width="2.5" height="50" fill="#222"/>
      </g>
      <rect x="-8" y="-50" width="34.5" height="4.5" fill="#222"/>
      <rect x="-8" y="-41" width="34.5" height="4.5" fill="#222"/>
    </g>
  </defs>

  <!-- 純白背景 -->
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 標題 -->
  <text x="900" y="85" class="title">Note Value Pyramids</text>

  <!-- ==================== LEVEL 1: 全音符 ==================== -->
  <g transform="translate(900, 140)">
    <use href="#whole-note"/>
    <text x="0" y="32" class="label-main">Semibreve (Whole Note)</text>
    <text x="0" y="54" class="label-sub">(4 Beats)</text>
  </g>

  <!-- 樹狀連線 L1 -> L2 (加寬跨度至 440 與 1360) -->
  <path class="tree-line" d="
    M 900, 205 L 900, 235
    M 440, 235 L 1360, 235
    M 440, 235 L 440, 260
    M 1360, 235 L 1360, 260
  "/>

  <!-- ==================== LEVEL 2: 二分音符 ==================== -->
  <!-- 左大分支頂端 -->
  <g transform="translate(440, 315)">
    <use href="#half-note"/>
    <text x="0" y="28" class="label-main">Minims (Half Notes)</text>
    <text x="0" y="50" class="label-sub">(2 Beats)</text>
  </g>

  <!-- 右大分支頂端 -->
  <g transform="translate(1360, 315)">
    <use href="#half-note"/>
    <text x="0" y="28" class="label-main">Minims (Half Notes)</text>
    <text x="0" y="50" class="label-sub">(2 Beats)</text>
  </g>

  <!-- 樹狀連線 L2 -> L3 -->
  <path class="tree-line" d="
    M 440, 375 L 440, 400
    M 230, 400 L 650, 400
    M 230, 400 L 230, 430
    M 650, 400 L 650, 430

    M 1360, 375 L 1360, 400
    M 1150, 400 L 1570, 400
    M 1150, 400 L 1150, 430
    M 1570, 400 L 1570, 430
  "/>

  <!-- ==================== LEVEL 3: 四分音符 ==================== -->
  <!-- 左分支下的 2 個四分音符 -->
  <g transform="translate(230, 485)">
    <use href="#quarter-note"/>
    <text x="0" y="26" class="label-main">Crotchets (Quarter)</text>
    <text x="0" y="48" class="label-sub">(1 Beat)</text>
  </g>
  <g transform="translate(650, 485)">
    <use href="#quarter-note"/>
    <text x="0" y="26" class="label-main">Crotchets (Quarter)</text>
    <text x="0" y="48" class="label-sub">(1 Beat)</text>
  </g>

  <!-- 右分支下的 2 個四分音符 -->
  <g transform="translate(1150, 485)">
    <use href="#quarter-note"/>
    <text x="0" y="26" class="label-main">Crotchets (Quarter)</text>
    <text x="0" y="48" class="label-sub">(1 Beat)</text>
  </g>
  <g transform="translate(1570, 485)">
    <use href="#quarter-note"/>
    <text x="0" y="26" class="label-main">Crotchets (Quarter)</text>
    <text x="0" y="48" class="label-sub">(1 Beat)</text>
  </g>

  <!-- 樹狀連線 L3 -> L4 -->
  <path class="tree-line" d="
    M 230, 545 L 230, 565   M 125, 565 L 335, 565   M 125, 565 L 125, 595   M 335, 565 L 335, 595
    M 650, 545 L 650, 565   M 545, 565 L 755, 565   M 545, 565 L 545, 595   M 755, 565 L 755, 595
    M 1150, 545 L 1150, 565 M 1045, 565 L 1255, 565 M 1045, 565 L 1045, 595 M 1255, 565 L 1255, 595
    M 1570, 545 L 1570, 565 M 1465, 565 L 1675, 565 M 1465, 565 L 1465, 595 M 1675, 565 L 1675, 595
  "/>

  <!-- ==================== LEVEL 4: 八分音符 ==================== -->
  <!-- 左大分支下的 4 個八分音符 -->
  <g transform="translate(125, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Quavers (Eighth)</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(335, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(545, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(755, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>

  <!-- 右大分支下的 4 個八分音符 (注意：與左側 755 保持 290px 充裕間隔) -->
  <g transform="translate(1045, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Quaver (Eighth)</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(1255, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(1465, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>
  <g transform="translate(1675, 650)">
    <use href="#eighth-note"/>
    <text x="0" y="24" class="label-main" font-size="20">Eighth</text>
    <text x="0" y="44" class="label-sub" font-size="17">(1/2 Beat)</text>
  </g>

  <!-- 樹狀連線 L4 -> L5 -->
  <path class="tree-line" d="
    M 125, 705 L 125, 725   M 85, 725 L 165, 725     M 85, 725 L 85, 745     M 165, 725 L 165, 745
    M 335, 705 L 335, 725   M 295, 725 L 375, 725   M 295, 725 L 295, 745   M 375, 725 L 375, 745
    M 545, 705 L 545, 725   M 505, 725 L 585, 725   M 505, 725 L 505, 745   M 585, 725 L 585, 745
    M 755, 705 L 755, 725   M 715, 725 L 795, 725   M 715, 725 L 715, 745   M 795, 725 L 795, 745

    M 1045, 705 L 1045, 725 M 1005, 725 L 1085, 725 M 1005, 725 L 1005, 745 M 1085, 725 L 1085, 745
    M 1255, 705 L 1255, 725 M 1215, 725 L 1295, 725 M 1215, 725 L 1215, 745 M 1295, 725 L 1295, 745
    M 1465, 705 L 1465, 725 M 1425, 725 L 1505, 725 M 1425, 725 L 1425, 745 M 1505, 725 L 1505, 745
    M 1675, 705 L 1675, 725 M 1635, 725 L 1715, 725 M 1635, 725 L 1635, 745 M 1715, 725 L 1715, 745
  "/>

  <!-- ==================== LEVEL 5: 十六分音符 ==================== -->
  <!-- 左大分支下的 4 組十六分音符 (X: 125, 335, 545, 755) -->
  <g transform="translate(125, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">Semiquavers (1/16)</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(335, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(545, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(755, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>

  <!-- 右大分支下的 4 組十六分音符 (X: 1045, 1255, 1465, 1675) -->
  <g transform="translate(1045, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">Semiquavers (1/16)</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(1255, 805)">
    <use href="#sixteenth-pair"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(1465, 805)">
    <use href="#sixteenth-note" x="-40" y="0"/>
    <use href="#sixteenth-note" x="40" y="0"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
  <g transform="translate(1675, 805)">
    <use href="#sixteenth-pair"/>
    <text x="0" y="24" class="label-main" font-size="18">1/16</text>
    <text x="0" y="44" class="label-sub" font-size="16">(1/4 Beat)</text>
  </g>
</svg>
