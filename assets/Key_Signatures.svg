<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 950">
  <defs>
    <!-- Staff Lines -->
    <g id="staff">
      <path d="M0 0 H130 M0 10 H130 M0 20 H130 M0 30 H130 M0 40 H130" stroke="black" stroke-width="1.2" />
      <path d="M0 0 V40 M130 0 V40" stroke="black" stroke-width="1.2" />
      <text x="8" y="50" font-family="serif" font-size="98">𝄞</text>
    </g>
    
    <text id="sharp" font-family="sans-serif" font-size="24" font-weight="normal">♯</text>
    <text id="flat" font-family="sans-serif" font-size="24" font-weight="normal">♭</text>
  </defs>

  <style>
    .major { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #E60000; }
    .minor { font-family: sans-serif; font-size: 24px; font-weight: bold; fill: #0000B3; }
    .grid { stroke: #999; stroke-width: 1; }
    .box { fill: none; stroke: #999; stroke-width: 1; }
    text { user-select: none; }
  </style>

  <rect width="900" height="950" fill="#F8F9FA" />
  <rect x="20" y="20" width="860" height="910" fill="white" stroke="#666" stroke-width="2" />
  
  <!-- Outer border of inner table -->
  <rect x="30" y="130" width="840" height="790" fill="none" stroke="#666" stroke-width="1" />
  
  <!-- Center divider (thick gray line) -->
  <rect x="440" y="130" width="20" height="790" fill="#CCC" stroke="#999" stroke-width="1" />
  
  <!-- Top Section (C major / A minor) -->
  <g transform="translate(385, 55)">
    <use href="#staff" />
  </g>
  <text x="365" y="80" class="major" text-anchor="end">C major</text>
  <text x="535" y="80" class="minor" text-anchor="start">A minor</text>
  
  <!-- Header separator -->
  <line x1="20" y1="120" x2="880" y2="120" stroke="#666" stroke-width="2" />

