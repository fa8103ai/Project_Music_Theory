<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="150" viewBox="0 0 450 150">
    <g stroke="#2c3e50" stroke-width="1.3">
        <line x1="20" y1="40" x2="430" y2="40"/>
        <line x1="20" y1="55" x2="430" y2="55"/>
        <line x1="20" y1="70" x2="430" y2="70"/>
        <line x1="20" y1="85" x2="430" y2="85"/>
        <line x1="20" y1="100" x2="430" y2="100"/>
    </g>
    
    <!-- Note below middle line: Stem UP on the RIGHT -->
    <ellipse cx="80" cy="85" rx="8" ry="6" fill="#1a5276"/>
    <line x1="88" y1="85" x2="88" y2="40" stroke="#1a5276" stroke-width="2"/>
    <text x="30" y="120" font-size="12" fill="#1a5276">Below middle line: Stem UP</text>
    
    <!-- Note above middle line: Stem DOWN on the LEFT -->
    <ellipse cx="225" cy="55" rx="8" ry="6" fill="#c0392b"/>
    <line x1="217" y1="55" x2="217" y2="100" stroke="#c0392b" stroke-width="2"/>
    <text x="180" y="35" font-size="12" fill="#c0392b">Above middle line: Stem DOWN</text>

    <!-- Quaver showing tail is ALWAYS on the right -->
    <ellipse cx="360" cy="85" rx="8" ry="6" fill="#e67e22"/>
    <line x1="368" y1="85" x2="368" y2="40" stroke="#e67e22" stroke-width="2"/>
    <path d="M368 40 Q383 45 383 58 Q376 52 368 50" fill="#e67e22"/>
    <text x="320" y="120" font-size="12" fill="#e67e22">Tail ALWAYS on RIGHT</text>
</svg>