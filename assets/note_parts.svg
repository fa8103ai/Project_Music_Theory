<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 40px;
        font-weight: 800;
        fill: #1e293b;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .subtitle {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 25px;
        font-weight: 500;
        fill: #64748b;
        text-anchor: middle;
      }
      .label-title {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 30px;
        font-weight: 700;
        fill: #0f172a;
      }
      .label-desc {
        font-family: 'Century Gothic', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 18px;
        font-weight: 500;
        fill: #64748b;
      }
      .pointer-line {
        stroke: #2563eb;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        fill: none;
      }
      .pointer-dot {
        fill: #2563eb;
      }
      .note-element {
        fill: #111827;
      }
      .divider {
        stroke: #e2e8f0;
        stroke-width: 1.5;
        stroke-dasharray: 6 6;
      }
    </style>
  </defs>

  <!-- 純白背景 -->
  <rect width="100%" height="100%" class="bg" />

  <!-- 頂部標題 -->
  <text x="640" y="65" class="title">MUSIC NOTE</text>
  <text x="640" y="98" class="subtitle">Anatomy of musical notes and their connections</text>

  <!-- ========================================== -->
  <!-- 左區塊：單一音符 (Note Head + Stem + Tail/Flag) -->
  <!-- ========================================== -->
  <g id="single-note-section">
    <!-- 符頭 Note Head -->
    <ellipse cx="370" cy="510" rx="42" ry="28" class="note-element" transform="rotate(-30 370 510)" />
    <!-- 符幹 Stem -->
    <rect x="402" y="240" width="8" height="270" class="note-element" rx="2" />
    <!-- 符尾 Tail / Flag -->
    <path d="M 410 240 C 425 300, 485 330, 465 410 C 460 380, 435 350, 410 330 Z" class="note-element" />

    <!-- 指示線與標籤：Stem (符幹) -->
    <circle cx="406" cy="370" r="5" class="pointer-dot" />
    <polyline points="406,370 290,370 210,370" class="pointer-line" />
    <text x="195" y="365" class="label-title" text-anchor="end">Stem</text>
    <text x="195" y="388" class="label-desc" text-anchor="end">符幹 (Vertical line)</text>

    <!-- 指示線與標籤：Note Head (符頭) -->
    <circle cx="370" cy="510" r="5" class="pointer-dot" />
    <polyline points="370,510 290,570 210,570" class="pointer-line" />
    <text x="195" y="565" class="label-title" text-anchor="end">Note Head</text>
    <text x="195" y="588" class="label-desc" text-anchor="end">符頭 (Defines pitch &amp; value)</text>

    <!-- 指示線與標籤：Tail / Flag (符尾) -->
    <circle cx="460" cy="360" r="5" class="pointer-dot" />
    <polyline points="460,360 505,310 560,310" class="pointer-line" />
    <text x="565" y="305" class="label-title">Tail / Flag</text>
    <text x="565" y="328" class="label-desc">符尾 (Eighth &amp; shorter notes)</text>
  </g>

  <!-- ========================================== -->
  <!-- 右區塊：成對音符 (Beam 符梁/符槓) -->
  <!-- ========================================== -->
  <g id="beamed-notes-section">
    <!-- 左音符符頭與符幹 -->
    <ellipse cx="780" cy="510" rx="36" ry="24" class="note-element" transform="rotate(-30 780 510)" />
    <rect x="808" y="270" width="7" height="240" class="note-element" rx="2" />

    <!-- 右音符符頭與符幹 -->
    <ellipse cx="980" cy="510" rx="36" ry="24" class="note-element" transform="rotate(-30 980 510)" />
    <rect x="1008" y="270" width="7" height="240" class="note-element" rx="2" />

    <!-- 符槓/符梁 Beam -->
    <polygon points="808,270 1015,270 1015,296 808,296" class="note-element" />

    <!-- 指示線與標籤：Beam (符槓/符梁) -->
    <circle cx="910" cy="283" r="5" class="pointer-dot" />
    <polyline points="910,283 960,220 1040,220" class="pointer-line" />
    <text x="1050" y="215" class="label-title">Beam</text>
    <text x="1050" y="238" class="label-desc">符槓 / 符梁 (Connects 2+ notes)</text>

    <!-- 下方說明文字 -->
    <text x="895" y="605" class="label-desc" text-anchor="middle" font-size="20">
      Beams replace tails/flags
    </text>
    <text x="895" y="628" class="label-desc" text-anchor="middle" font-size="20">
      when notes are grouped together.
    </text>
  </g>
</svg>