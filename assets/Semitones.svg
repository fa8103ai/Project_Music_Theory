<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 667 460" role="img" aria-labelledby="title desc">
  <title id="title">Tones and Semitones in a Major Scale</title>
  <desc id="desc">A one-octave piano keyboard labeled C through C, with tone and semitone intervals shown below.</desc>
  <defs>
    <style>
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 700; fill: #ed292e; }
      .note-label { font-family: Arial, Helvetica, sans-serif; font-size: 40px; font-weight: 700; fill: #050505; text-anchor: middle; }
      .interval-label { font-family: Arial, Helvetica, sans-serif; font-size: 32px; font-weight: 700; fill: #050505; text-anchor: middle; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; fill: #050505; }
      .key-outline { fill: #fff; stroke: #333; stroke-width: 1.1; }
      .black-key { fill: #000; }
      .bracket { fill: none; stroke: #000; stroke-width: 5.2; stroke-linecap: square; stroke-linejoin: miter; }
    </style>
  </defs>

  <!-- White canvas -->
  <g id="background">
    <rect x="0" y="0" width="667" height="460" fill="#fff"/>
  </g>

  <!-- Heading -->
  <g id="typography-heading">
    <text class="heading" x="76" y="28">Tones and Semitones in a Major Scale</text>
  </g>

  <!-- Piano keyboard: white keys and their boundaries -->
  <g id="main-shapes-keyboard">
    <rect class="key-outline" x="27.5" y="44.5" width="606" height="272.5"/>
    <path d="M103 45 V317 M179 45 V317 M254.5 45 V317 M330.5 45 V317 M406.5 45 V317 M482 45 V317 M558 45 V317" fill="none" stroke="#333" stroke-width="1.1"/>

    <!-- Black keys: C-sharp, D-sharp, F-sharp, G-sharp, A-sharp, and the next C-sharp at the crop edge -->
    <rect class="black-key" x="84.5" y="45" width="37.5" height="170.5"/>
    <rect class="black-key" x="160.5" y="45" width="37.5" height="170.5"/>
    <rect class="black-key" x="312" y="45" width="38" height="170.5"/>
    <rect class="black-key" x="388.5" y="45" width="37.5" height="170.5"/>
    <rect class="black-key" x="464.5" y="45" width="37.5" height="170.5"/>
    <rect class="black-key" x="615.5" y="45" width="18" height="170.5"/>
  </g>

  <!-- Note names -->
  <g id="typography-note-labels">
    <text class="note-label" x="64" y="288">C</text>
    <text class="note-label" x="140.5" y="288">D</text>
    <text class="note-label" x="209" y="288">E</text>
    <text class="note-label" x="292" y="288">F</text>
    <text class="note-label" x="368" y="288">G</text>
    <text class="note-label" x="444" y="288">A</text>
    <text class="note-label" x="520" y="288">B</text>
    <text class="note-label" x="596" y="288">C</text>
  </g>

  <!-- Interval brackets, one for each step in the major scale -->
  <g id="details-interval-brackets" class="bracket">
    <path d="M61.5 337 V367 H130.5 V337"/>
    <path d="M138.5 337 V367 H207.5 V337"/>
    <path d="M214.5 337 V367 H283.5 V337"/>
    <path d="M290.5 337 V367 H359.5 V337"/>
    <path d="M366.5 337 V367 H435.5 V337"/>
    <path d="M442.5 337 V367 H511.5 V337"/>
    <path d="M518.5 337 V367 H590.5 V337"/>
  </g>

  <!-- Tone / semitone labels -->
  <g id="typography-interval-labels">
    <text class="interval-label" x="95.5" y="409">T</text>
    <text class="interval-label" x="173" y="409">T</text>
    <text class="interval-label" x="249" y="409">S</text>
    <text class="interval-label" x="325" y="409">T</text>
    <text class="interval-label" x="401" y="409">T</text>
    <text class="interval-label" x="477" y="409">T</text>
    <text class="interval-label" x="554.5" y="409">S</text>
    <text class="caption" x="80" y="438">Tone - Tone - Semitone - Tone - Tone - Tone - Semitone</text>
  </g>
</svg>
