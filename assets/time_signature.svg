<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 112" role="img" aria-labelledby="title desc">
  <title id="title">Four-four time signature and three measures</title>
  <desc id="desc">A treble-clef staff in four-four time, with three measures, beat numbers above the notes, and note stems on the right side of every notehead.</desc>
  <defs>
    <style>
      .staff { fill:none; stroke:#111; stroke-width:1.15; }
      .bar { fill:none; stroke:#111; stroke-width:1.35; }
      .stem { fill:none; stroke:#111; stroke-width:1.15; }
      .beat { font-family:"Times New Roman",serif; font-size:24px; fill:#111; text-anchor:middle; }
      .note { fill:#111; stroke:#111; stroke-width:1; }
    </style>
  </defs>

  <!-- White background -->
  <g id="background"><rect width="792" height="112" fill="#fff"/></g>

  <!-- Five-line staff and measure bars -->
  <g id="staff" class="staff">
    <path d="M33 59.5H754 M33 70.5H754 M33 81.5H754 M33 92.5H754 M33 103.5H754"/>
  </g>
  <g id="bar-lines" class="bar">
    <path d="M328 59V104 M548 59V104"/>
  </g>

  <!-- Treble clef and stacked 4/4 time signature, without a fraction bar -->
  <g id="clef-and-time" fill="#111">
    <text x="43" y="104" font-family="serif" font-size="76">𝄞</text>
    <text x="88" y="79" font-family="serif" font-size="25" font-weight="bold">4</text>
    <text x="88" y="103" font-family="serif" font-size="25" font-weight="bold">4</text>
  </g>

  <!-- Beat numbers -->
  <g id="beat-numbers" class="beat">
    <text x="131" y="40">1</text><text x="182" y="40">2</text><text x="234" y="40">3</text><text x="286" y="40">4</text>
    <text x="354" y="40">1</text><text x="405" y="40">2</text><text x="457" y="40">3</text><text x="500" y="40">4</text>
    <text x="574" y="40">1</text><text x="625" y="40">2</text><text x="677" y="40">3</text><text x="717" y="40">4</text>
  </g>

  <!-- All note stems are on the right side of their noteheads -->
  <g id="notes">
    <g class="stem">
      <path d="M138.5 87V59 M189.5 93V59 M241.5 99V59 M293.5 93V59"/>
      <path d="M361.5 87V59 M412.5 87V59 M464.5 87V59"/>
      <path d="M581.5 93V59 M632.5 93V59 M684.5 93V59"/>
    </g>
    <g class="note">
      <ellipse cx="131" cy="87.5" rx="7.5" ry="5.2" transform="rotate(-18 131 87.5)"/>
      <ellipse cx="182" cy="93.5" rx="7.5" ry="5.2" transform="rotate(-18 182 93.5)"/>
      <ellipse cx="234" cy="99.5" rx="7.5" ry="5.2" transform="rotate(-18 234 99.5)"/>
      <ellipse cx="286" cy="93.5" rx="7.5" ry="5.2" transform="rotate(-18 286 93.5)"/>
      <ellipse cx="354" cy="87.5" rx="7.5" ry="5.2" transform="rotate(-18 354 87.5)"/>
      <ellipse cx="405" cy="87.5" rx="7.5" ry="5.2" transform="rotate(-18 405 87.5)"/>
      <ellipse cx="574" cy="93.5" rx="7.5" ry="5.2" transform="rotate(-18 574 93.5)"/>
      <ellipse cx="625" cy="93.5" rx="7.5" ry="5.2" transform="rotate(-18 625 93.5)"/>
    </g>
    <g fill="#fff" stroke="#111" stroke-width="1.25">
      <ellipse cx="457" cy="87.5" rx="7.5" ry="5.2" transform="rotate(-18 457 87.5)"/>
      <ellipse cx="677" cy="93.5" rx="7.5" ry="5.2" transform="rotate(-18 677 93.5)"/>
    </g>
  </g>
</svg>
